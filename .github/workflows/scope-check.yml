name: Submission scope check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'maintainer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check submission-only changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD | node check-scope.mjs
