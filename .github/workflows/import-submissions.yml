name: Import benchmark ZIP submissions

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-tester-zip-import-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up runtimes
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate and import uploaded ZIP files
        id: imports
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP files found in incoming/."
            exit 0
          fi

          failures=0
          for zip in "${zips[@]}"; do
            echo "::group::Processing $zip"
            if python scripts/import-submission-zip.py "$zip"; then
              rm -- "$zip"
              echo "Imported and removed $zip"
            else
              echo "::error file=$zip::ZIP rejected. It has been left in incoming/ for inspection."
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          node build-index.mjs

          if [ "$failures" -gt 0 ]; then
            echo "$failures ZIP file(s) were rejected. Valid submissions were still processed."
            exit 1
          fi

      - name: Commit imported submissions and index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/
          git add -u incoming/
          if git diff --cached --quiet; then
            echo "No successful imports to publish."
            exit 0
          fi
          git commit -m "chore: import ZIP benchmark submissions"
          git push origin HEAD:main
